name: posix-mq test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - '10'
          - '12'
          - '14'
          - '16'
          - '18'
          - '20'
          - '22'
          - '24'
          - '26'

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: sudo apt install -y build-essential
      - name: Debug versions
        run: which node
      - run: node --version
      - run: which npm
      - run: npm --version
      - name: Build package
        run: npm install
      - name: Run test
        run: node test.js

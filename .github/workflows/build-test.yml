name: posix-mq test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '10'
          - '12'
          - '14'
          - '16'
          - '18'
          - '20'
          - '22'
          - '24'
          - '26'

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Use Python 3.10 for older node-gyp versions
        if: matrix.node-version == '10' || matrix.node-version == '12' || matrix.node-version == '14'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: sudo apt install -y build-essential
      - name: Debug versions
        run: which node
      - run: node --version
      - run: which npm
      - run: npm --version
      - name: Build package
        run: npm install
      - name: Run test
        run: npm test
      - name: Run worker thread tests
        if: matrix.node-version != '10'
        run: |
          npm run test:worker

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v"
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release input
        id: release
        env:
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "mikeokner" ]]; then
            echo "Only mikeokner may run this workflow." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Run releases from the master branch." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-rc.1." >&2
            exit 1
          fi

          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          if npm view "posix-mq@$VERSION" version >/dev/null 2>&1; then
            echo "npm version already exists: posix-mq@$VERSION" >&2
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$tag"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Update package versions
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run worker thread tests
        run: npm run test:worker

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Commit release version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if git diff --quiet -- package.json package-lock.json; then
            echo "package.json and package-lock.json are already at $TAG."
          else
            git add package.json package-lock.json
            git commit -m "Release $TAG"
            git push origin HEAD:master
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish to npm
        env:
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: npm publish --tag "$NPM_TAG"

      - name: Create and push tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "$TAG" "$release_sha"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          extra_args=()
          if [[ "$VERSION" == *-* ]]; then
            extra_args+=(--prerelease)
          else
            extra_args+=(--latest)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${extra_args[@]}"
